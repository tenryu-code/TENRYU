<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Spherical chord ray tracing in the radius and impact-parameter plane</title>
  <desc id="desc">Several rays enter a spherical underdense corona with different impact parameters. Refraction bends two rays toward Bouguer turning points, inverse-bremsstrahlung deposition occurs along both legs, and a central ray terminates at the critical surface.</desc>
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fecaca" stop-opacity="0.86"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.74"/>
      <stop offset="0.72" stop-color="#bfdbfe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="ray-energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="460" rx="16" fill="#f8fafc"/>
  <text x="28" y="31" fill="#0f172a" font-family="sans-serif" font-size="17" font-weight="700">1D spherical chord raytrace</text>

  <line x1="40" y1="230" x2="604" y2="230" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 6"/>
  <text x="604" y="219" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="13">beam axis z</text>

  <circle cx="397" cy="230" r="178" fill="url(#corona)" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="397" cy="230" r="116" fill="#fee2e2" fill-opacity="0.74" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="397" cy="230" r="72" fill="#cbd5e1" fill-opacity="0.84" stroke="#64748b" stroke-width="2"/>
  <text x="483" y="93" fill="#1d4ed8" font-family="sans-serif" font-size="13" font-weight="700">underdense corona</text>
  <line x1="478" y1="99" x2="461" y2="126" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="461" y="318" fill="#b91c1c" font-family="sans-serif" font-size="13" font-weight="700">critical surface</text>
  <line x1="457" y1="309" x2="444" y2="296" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="372" y="235" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="700">overdense</text>

  <line x1="62" y1="230" x2="206" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M62 154 C177 154 247 153 300 167 C339 177 361 193 373 210" fill="none" stroke="url(#ray-energy)" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <path d="M373 210 C354 195 324 188 286 190 C222 194 162 196 92 196" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <path d="M62 106 C183 106 267 108 331 132 C370 147 397 168 413 193" fill="none" stroke="url(#ray-energy)" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <path d="M413 193 C397 170 369 149 333 135 C274 113 197 112 102 114" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <path d="M206 230 C237 230 260 230 281 230" fill="none" stroke="url(#ray-energy)" stroke-width="3.2" marker-end="url(#arrow-blue)"/>

  <g fill="#f97316" filter="url(#glow)">
    <circle cx="284" cy="163" r="3.4"/><circle cx="318" cy="174" r="4.2"/><circle cx="347" cy="190" r="5"/>
    <circle cx="346" cy="194" r="4.5"/><circle cx="310" cy="189" r="3.8"/><circle cx="271" cy="191" r="3.2"/>
    <circle cx="333" cy="133" r="3.2"/><circle cx="367" cy="149" r="4"/><circle cx="394" cy="171" r="4.8"/>
    <circle cx="390" cy="165" r="4"/><circle cx="354" cy="142" r="3.5"/>
    <circle cx="235" cy="230" r="3.2"/><circle cx="258" cy="230" r="4.2"/><circle cx="281" cy="230" r="5.2"/>
  </g>
  <text x="242" y="281" fill="#c2410c" font-family="sans-serif" font-size="13" font-weight="700">IB deposition on the trajectory</text>
  <line x1="315" y1="272" x2="331" y2="204" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <circle cx="373" cy="210" r="6" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <line x1="373" y1="210" x2="397" y2="230" stroke="#475569" stroke-width="1.5"/>
  <text x="378" y="200" fill="#4c1d95" font-family="sans-serif" font-size="13" font-weight="700">r<tspan baseline-shift="sub" font-size="10">B</tspan></text>
  <text x="413" y="215" fill="#475569" font-family="sans-serif" font-size="12">Bouguer turn</text>

  <line x1="77" y1="230" x2="77" y2="154" stroke="#475569" stroke-width="1.4"/>
  <line x1="70" y1="230" x2="84" y2="230" stroke="#475569" stroke-width="1.4"/>
  <line x1="70" y1="154" x2="84" y2="154" stroke="#475569" stroke-width="1.4"/>
  <text x="63" y="194" text-anchor="end" fill="#334155" font-family="sans-serif" font-size="15" font-style="italic">b</text>

  <line x1="281" y1="216" x2="281" y2="244" stroke="#dc2626" stroke-width="2.3"/>
  <line x1="274" y1="220" x2="288" y2="240" stroke="#dc2626" stroke-width="2.3"/>
  <line x1="288" y1="220" x2="274" y2="240" stroke="#dc2626" stroke-width="2.3"/>
  <text x="230" y="257" fill="#b91c1c" font-family="sans-serif" font-size="12" font-weight="700">critical termination</text>

  <g transform="translate(36 375)" font-family="sans-serif" font-size="12">
    <rect x="0" y="0" width="568" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="18" y1="18" x2="57" y2="18" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="68" y="22" fill="#334155">incident power</text>
    <circle cx="182" cy="18" r="4" fill="#f97316"/>
    <text x="194" y="22" fill="#334155">absorbed power ΔP</text>
    <line x1="330" y1="18" x2="365" y2="18" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="374" y="22" fill="#334155">nₑ = n<tspan baseline-shift="sub" font-size="9">crit</tspan></text>
    <text x="18" y="43" fill="#64748b">Spherical symmetry reduces field lookup and deposition to r = √(R² + Z²).</text>
  </g>
</svg>
