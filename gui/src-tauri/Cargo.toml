[package]
name = "tenryu-studio"
version = "0.1.0"
description = "TENRYU Studio - namelist editor & remote runner"
authors = ["TENRYU project"]
edition = "2021"

[lib]
name = "tenryu_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
