<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Option C の MPI 所有ウィンドウと ghost 交換</title>
  <desc id="desc">3つの rank が同じ12 cell の global index 空間を保持する。各 rank の所有 cell は青、2層 ghost は黄、far 領域は灰色で、rank 間の矢印が owner-overwrite を示す。</desc>
  <defs>
    <pattern id="far" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f1f5f9"/>
      <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="960" height="470" rx="14" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="21" font-weight="700">Option C: 全 rank が同じ global index 空間を保持</text>
  <text x="195" y="76" fill="#475569" font-family="sans-serif" font-size="14">global cell index c →</text>

  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#475569">
    <text x="216" y="98">0</text><text x="268" y="98">1</text><text x="320" y="98">2</text><text x="372" y="98">3</text>
    <text x="424" y="98">4</text><text x="476" y="98">5</text><text x="528" y="98">6</text><text x="580" y="98">7</text>
    <text x="632" y="98">8</text><text x="684" y="98">9</text><text x="736" y="98">10</text><text x="788" y="98">11</text>
  </g>

  <g font-family="sans-serif" font-size="17" font-weight="700" fill="#334155">
    <text x="96" y="141">rank 0</text>
    <text x="96" y="231">rank 1</text>
    <text x="96" y="321">rank 2</text>
  </g>

  <g stroke="#ffffff" stroke-width="2">
    <g>
      <rect x="190" y="112" width="52" height="54" fill="#2563eb"/><rect x="242" y="112" width="52" height="54" fill="#2563eb"/>
      <rect x="294" y="112" width="52" height="54" fill="#2563eb"/><rect x="346" y="112" width="52" height="54" fill="#2563eb"/>
      <rect x="398" y="112" width="52" height="54" fill="#fbbf24"/><rect x="450" y="112" width="52" height="54" fill="#fbbf24"/>
      <rect x="502" y="112" width="52" height="54" fill="url(#far)"/><rect x="554" y="112" width="52" height="54" fill="url(#far)"/>
      <rect x="606" y="112" width="52" height="54" fill="url(#far)"/><rect x="658" y="112" width="52" height="54" fill="url(#far)"/>
      <rect x="710" y="112" width="52" height="54" fill="url(#far)"/><rect x="762" y="112" width="52" height="54" fill="url(#far)"/>
    </g>
    <g>
      <rect x="190" y="202" width="52" height="54" fill="url(#far)"/><rect x="242" y="202" width="52" height="54" fill="url(#far)"/>
      <rect x="294" y="202" width="52" height="54" fill="#fbbf24"/><rect x="346" y="202" width="52" height="54" fill="#fbbf24"/>
      <rect x="398" y="202" width="52" height="54" fill="#2563eb"/><rect x="450" y="202" width="52" height="54" fill="#2563eb"/>
      <rect x="502" y="202" width="52" height="54" fill="#2563eb"/><rect x="554" y="202" width="52" height="54" fill="#2563eb"/>
      <rect x="606" y="202" width="52" height="54" fill="#fbbf24"/><rect x="658" y="202" width="52" height="54" fill="#fbbf24"/>
      <rect x="710" y="202" width="52" height="54" fill="url(#far)"/><rect x="762" y="202" width="52" height="54" fill="url(#far)"/>
    </g>
    <g>
      <rect x="190" y="292" width="52" height="54" fill="url(#far)"/><rect x="242" y="292" width="52" height="54" fill="url(#far)"/>
      <rect x="294" y="292" width="52" height="54" fill="url(#far)"/><rect x="346" y="292" width="52" height="54" fill="url(#far)"/>
      <rect x="398" y="292" width="52" height="54" fill="url(#far)"/><rect x="450" y="292" width="52" height="54" fill="url(#far)"/>
      <rect x="502" y="292" width="52" height="54" fill="#fbbf24"/><rect x="554" y="292" width="52" height="54" fill="#fbbf24"/>
      <rect x="606" y="292" width="52" height="54" fill="#2563eb"/><rect x="658" y="292" width="52" height="54" fill="#2563eb"/>
      <rect x="710" y="292" width="52" height="54" fill="#2563eb"/><rect x="762" y="292" width="52" height="54" fill="#2563eb"/>
    </g>
  </g>

  <g stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M344,164 C344,180 364,184 364,200"/>
    <path d="M426,202 C426,185 406,182 406,166"/>
    <path d="M552,256 C552,272 572,276 572,290"/>
    <path d="M634,292 C634,276 614,272 614,258"/>
  </g>
  <text x="835" y="225" fill="#0f766e" font-family="sans-serif" font-size="14" font-weight="700">owner-overwrite</text>
  <text x="835" y="245" fill="#475569" font-family="sans-serif" font-size="13">隣接 rank へ交換</text>

  <g fill="none" stroke-linecap="round">
    <path d="M400,374 v10 h204 v-10" stroke="#2563eb" stroke-width="3"/>
    <path d="M296,404 v10 h412 v-10" stroke="#d97706" stroke-width="3"/>
  </g>
  <text x="502" y="399" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="14" font-weight="700">cw: owned cell window</text>
  <text x="502" y="434" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="700">pw / fw: owned + 2-layer ghost window</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="78" y="390" width="20" height="16" fill="#2563eb"/><text x="106" y="403" fill="#334155">所有</text>
    <rect x="78" y="416" width="20" height="16" fill="#fbbf24"/><text x="106" y="429" fill="#334155">ghost</text>
    <rect x="78" y="442" width="20" height="16" fill="url(#far)" stroke="#cbd5e1"/><text x="106" y="455" fill="#334155">far（stale-but-finite）</text>
  </g>
</svg>
